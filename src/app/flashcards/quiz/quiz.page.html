<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()" [attr.aria-label]="t('mode.close')">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      <span *ngIf="levelNumber > 0">{{ t('mode.levelPrefix', { n: levelNumber }) }}</span>
      {{ t('mode.titleQuiz') }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addWord()" [attr.aria-label]="t('mode.addWord')">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-progress-bar [value]="progress / 100" color="primary"></ion-progress-bar>
</ion-header>

<ion-content [fullscreen]="true" class="quiz-content">
  <!-- Play phase -->
  <div *ngIf="phase === 'play'" class="quiz-container">
    <p class="quiz-hint">{{ t('mode.whichTranslation') }}</p>

    <!-- Word + a single audio icon (recorded, with TTS fallback) -->
    <div class="quiz-prompt-row">
      <span class="quiz-prompt">{{ prompt }}</span>
      <div class="audio-actions">
        <button type="button" class="audio-icon" (click)="playWord()" [attr.aria-label]="t('mode.playPronunciation')">
          <ion-icon name="volume-high-outline"></ion-icon>
        </button>
        <button type="button" class="audio-icon slow" *ngIf="showSlowButton" (click)="playWord(true)" [attr.aria-label]="t('mode.playSlower')">
          <ion-icon name="volume-low-outline"></ion-icon>
        </button>
      </div>
    </div>

    <div class="quiz-options">
      <button
        *ngFor="let opt of options"
        type="button"
        class="quiz-option"
        [class.correct]="opt.revealed && opt.correct"
        [class.wrong]="opt.revealed && opt.chosen && !opt.correct"
        [disabled]="opt.revealed"
        (click)="choose(opt)">
        {{ opt.label }}
      </button>
    </div>
  </div>

  <!-- Complete phase -->
  <div *ngIf="phase === 'complete'" class="complete-container">
    <div *ngIf="levelNumber > 0" class="stars-display gamification">
      <ion-icon *ngFor="let s of [1,2,3]" [name]="s <= earnedStars ? 'star' : 'star-outline'"
        class="star" [class.filled]="s <= earnedStars"></ion-icon>
    </div>
    <div *ngIf="levelNumber === 0" class="complete-emoji gamification">🎉</div>

    <h1>{{ t('mode.quizComplete') }}</h1>
    <p *ngIf="isNewBest" class="new-best gamification">{{ t('mode.newBest') }}</p>
    <p class="complete-sub">
      {{ t('mode.correctOfTotal', { correct: correctCount, total: total }) }}
    </p>

    <ion-button expand="block" (click)="finish()" class="finish-button">
      {{ t('mode.done') }}
    </ion-button>
  </div>
</ion-content>
