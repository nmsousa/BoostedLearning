<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'journey.title' | translate }}</ion-title>
    <ion-buttons slot="end">
      <button type="button" class="lang-trigger" id="journey-lang-trigger"
        aria-label="Change learning language">
        <img class="flag" [src]="currentLanguage.flagUrl" [alt]="currentLanguage.name" />
        <ion-icon name="chevron-down" class="lang-caret"></ion-icon>
      </button>
      <ion-popover trigger="journey-lang-trigger" [dismissOnSelect]="true" side="bottom" alignment="end">
        <ng-template>
          <ion-list class="lang-list">
            <ion-item *ngFor="let lang of availableLanguages" button detail="false" lines="none"
              [class.active]="lang.code === learningLanguage" (click)="selectLanguage(lang.code)">
              <img class="flag" slot="start" [src]="lang.flagUrl" [alt]="lang.name" />
              <ion-label>{{ lang.name }}</ion-label>
              <ion-icon *ngIf="lang.code === learningLanguage" name="checkmark" slot="end" color="primary"></ion-icon>
            </ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
      <ion-button (click)="openMenu()" [attr.aria-label]="'practice.menu' | translate">
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="journey-content">
  <div *ngIf="isLoading" class="mode-loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && deck" class="journey">
    <!-- One chapter per skill. Each has 5 fixed nodes (flip → quiz → match →
         write → builder). Locked chapters are shown dimmed with locked nodes. -->
    <div class="chapter" *ngFor="let chapter of chapters; let ci = index"
      [id]="'journey-chapter-' + ci" [class.locked]="!chapter.unlocked"
      [class.complete]="chapter.complete">
      <div class="chapter-head">
        <span class="chapter-badge">{{ chapter.number }}</span>
        <span class="chapter-name">{{ chapter.name }}</span>
        <span class="chapter-progress">{{ chapter.done }}/5</span>
        <ion-icon *ngIf="!chapter.unlocked" name="lock-closed" class="chapter-lock"></ion-icon>
      </div>

      <!-- The 5 activity nodes in a row, each with its mode icon + colour. -->
      <div class="nodes">
        <button type="button" class="node" *ngFor="let node of chapter.nodes"
          [class.passed]="node.passed"
          [class.locked]="!node.unlocked"
          [disabled]="!node.unlocked"
          [attr.aria-label]="nodeLabel(node.type)"
          (click)="startNode(chapter, node)">
          <ion-icon *ngIf="node.unlocked && !node.passed" [name]="node.icon" [color]="node.color"></ion-icon>
          <ion-icon *ngIf="node.passed" name="checkmark" class="node-check"></ion-icon>
          <ion-icon *ngIf="!node.unlocked" name="lock-closed" class="node-lock"></ion-icon>
          <span class="node-label">{{ nodeLabel(node.type) }}</span>
        </button>
      </div>
    </div>
  </div>
</ion-content>
