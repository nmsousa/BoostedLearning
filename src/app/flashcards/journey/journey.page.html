<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <span class="mode-title">
        <ion-icon name="map-outline" color="warning" class="mode-title-icon" aria-hidden="true"></ion-icon>
        <span class="mode-title-text">{{ 'journey.title' | translate }}</span>
      </span>
    </ion-title>
    <ion-buttons slot="end">
      <button type="button" class="lang-trigger" id="journey-lang-trigger"
        aria-label="Change learning language">
        <img class="flag" [src]="currentLanguage.flagUrl" [alt]="currentLanguage.name" />
        <ion-icon name="chevron-down" class="lang-caret"></ion-icon>
      </button>
      <ion-popover trigger="journey-lang-trigger" [dismissOnSelect]="true" side="bottom" alignment="end">
        <ng-template>
          <ion-list class="lang-list">
            <ion-item *ngFor="let lang of availableLanguages" button detail="false" lines="none"
              [class.active]="lang.code === learningLanguage" (click)="selectLanguage(lang.code)">
              <img class="flag" slot="start" [src]="lang.flagUrl" [alt]="lang.name" />
              <ion-label>{{ lang.name }}</ion-label>
              <ion-icon *ngIf="lang.code === learningLanguage" name="checkmark" slot="end" color="primary"></ion-icon>
            </ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
      <ion-button (click)="openMenu()" [attr.aria-label]="'practice.menu' | translate">
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="journey-content">
  <div *ngIf="isLoading" class="mode-loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && deck" class="journey">
    <!-- One chapter per skill. Each has the fixed activity nodes (flip → quiz →
         write → match → builder, plus Blanks on French decks). Locked chapters
         are shown dimmed with locked nodes. -->
    <div class="chapter" *ngFor="let chapter of chapters; let ci = index"
      [id]="'journey-chapter-' + ci" [class.locked]="!chapter.unlocked"
      [class.complete]="chapter.complete">
      <div class="chapter-head">
        <span class="chapter-badge">{{ chapter.number }}</span>
        <span class="chapter-name">{{ chapter.name }}</span>
        <ion-icon *ngIf="!chapter.unlocked" name="lock-closed" class="chapter-lock"></ion-icon>
      </div>

      <!-- Serpentine trail of the activity nodes (same winding layout as the
           original design), each node a different game mode in fixed order:
           Flashcards → Quiz → Write → Match → Builder (→ Blanks, French only). -->
      <div class="trail">
        <!-- Dashed tilde path threading through the nodes, drawn behind them.
             X is a 0-100 percent; Y is in px (1:1 with the laid-out rows). -->
        <svg class="trail-path" [attr.viewBox]="trailViewBox(chapter.nodes)"
          [style.height.px]="trailHeight(chapter.nodes)" preserveAspectRatio="none" aria-hidden="true">
          <!-- One dashed segment per gap; it turns green once the node it leaves
               is passed, otherwise it stays grey. -->
          <path *ngFor="let seg of trailSegments(chapter)" [attr.d]="seg.d" fill="none"
            [attr.stroke]="seg.stroke" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="4 9" vector-effect="non-scaling-stroke"></path>
        </svg>
        <div class="node-row" *ngFor="let node of chapter.nodes; let ni = index">
          <button type="button" class="node"
            [style.left.%]="nodeLeftPercent(ni)"
            [class.passed]="node.passed"
            [class.current]="isCurrentNode(chapter, node)"
            [class.locked]="!node.unlocked"
            [disabled]="!node.unlocked"
            [attr.aria-label]="nodeLabel(node.type)"
            (click)="startNode(chapter, node)">
            <!-- Mode icon: its homepage colour only when it's a plain playable
                 node; the current node turns it white (light-blue fill) and the
                 passed node shows a white check on green. -->
            <ion-icon *ngIf="node.unlocked && !node.passed && !isCurrentNode(chapter, node)"
              [name]="node.icon" [color]="node.color"></ion-icon>
            <ion-icon *ngIf="node.unlocked && !node.passed && isCurrentNode(chapter, node)"
              [name]="node.icon" class="node-current-icon"></ion-icon>
            <ion-icon *ngIf="node.passed" name="checkmark" class="node-check"></ion-icon>
            <ion-icon *ngIf="!node.unlocked" name="lock-closed" class="node-lock"></ion-icon>
            <span class="node-label">{{ nodeLabel(node.type) }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
