<!-- Painted scene behind everything: starry night sky + the illustration as a
     skyline band toward the bottom. Fixed, purely decorative. The scene element
     is also what we measure for the map width. -->
<div class="pp-scene" aria-hidden="true" #scene>
  <div class="pp-skyline"></div>
</div>

<ion-header class="pp-header ion-no-border">
  <ion-toolbar>
    <div class="pp-head">
      <button type="button" class="pp-back" (click)="close()" [attr.aria-label]="'journeyPlus.back' | translate">
        <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
      </button>

      <!-- The header names the section you're looking at (updates on scroll). -->
      <h1 class="pp-title">{{ headerTitle }}</h1>

      <button type="button" class="pp-lang" id="jpp-lang-trigger"
        [attr.aria-label]="'journeyPlus.changeLanguage' | translate">
        <span class="pp-flag"><img [src]="currentLanguage.flagUrl" alt="" /></span>
        <ion-icon name="chevron-down" class="pp-lang-caret" aria-hidden="true"></ion-icon>
      </button>
      <ion-popover trigger="jpp-lang-trigger" [dismissOnSelect]="true" side="bottom" alignment="end">
        <ng-template>
          <ion-list class="lang-list">
            <ion-item *ngFor="let lang of availableLanguages" button detail="false" lines="none"
              [class.active]="lang.code === learningLanguage" (click)="selectLanguage(lang.code)">
              <img class="flag" slot="start" [src]="lang.flagUrl" [alt]="lang.name" />
              <ion-label>{{ lang.name }}</ion-label>
              <ion-icon *ngIf="lang.code === learningLanguage" name="checkmark" slot="end" color="primary"></ion-icon>
            </ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
    </div>

    <!-- Progress for the section in the header: "N/total", a bar, and x%. -->
    <div class="pp-head-progress" *ngIf="!isLoading && headerChapter">
      <span class="pp-head-count">{{ headerDone }} / {{ headerTotal }}</span>
      <div class="pp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="headerPct">
        <span class="pp-bar-fill" [style.width.%]="headerPct"></span>
      </div>
      <span class="pp-head-pct">{{ 'journeyPlus.percentDone' | translate:{ p: headerPct } }}</span>
    </div>
  </ion-toolbar>
</ion-header>

<!-- Not fullscreen: content ends above the HUD, so it never covers a node. -->
<ion-content class="pp-content" #content [scrollEvents]="true" (ionScroll)="onContentScroll()">
  <div *ngIf="isLoading" class="pp-loading"><ion-spinner name="crescent"></ion-spinner></div>
  <p *ngIf="!isLoading && !deck" class="pp-empty">{{ 'journeyPlus.empty' | translate }}</p>

  <!-- All chapters stacked in one continuous scroll: a light header per chapter
       then its node route, then the next chapter below. -->
  <div *ngIf="!isLoading && deck" class="pp-stream">
    <section class="pp-chapter" *ngFor="let block of mapChapters; trackBy: trackChapter"
      [id]="'jpp-chapter-' + block.index" [class.is-current]="block.current"
      [class.is-locked]="!block.chapter.unlocked">

      <header class="pp-chapter-head">
        <span class="pp-chapter-name">{{ block.title }}</span>
      </header>

      <div class="pp-map" [style.height.px]="block.mapHeight">
        <svg class="pp-route" [attr.viewBox]="'0 0 ' + mapWidth + ' ' + block.mapHeight"
          [attr.width]="mapWidth" [attr.height]="block.mapHeight" aria-hidden="true">
          <defs>
            <linearGradient [attr.id]="'ppDone-' + block.index" x1="0" y1="0" x2="0"
              [attr.y2]="block.mapHeight" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#5dfaa6" />
              <stop offset="1" stop-color="#3fd8ff" />
            </linearGradient>
          </defs>
          <path *ngIf="block.pathAhead" class="ahead-glow" [attr.d]="block.pathAhead" />
          <path *ngIf="block.pathAhead" class="ahead" [attr.d]="block.pathAhead" />
          <path *ngIf="block.pathDone" class="done-glow" [attr.d]="block.pathDone" />
          <path *ngIf="block.pathDone" class="done" [attr.d]="block.pathDone"
            [attr.stroke]="'url(#ppDone-' + block.index + ')'" />
        </svg>

        <div class="pp-stop" *ngFor="let stop of block.stops; trackBy: trackStop"
          [ngClass]="'state-' + stop.state"
          [style.top.px]="stop.y" [style.--x]="stop.xPct + '%'" [style.--i]="stop.index">

          <!-- Pill panel anchored at the node centre, extending right; the node
               sits on top of its leading end. Mirrors the node's tap. -->
          <div class="pp-panel" aria-hidden="true" (click)="openStop(block, stop)">
            <div class="pp-panel-text">
              <span class="pp-panel-title">
                <span *ngIf="stop.state === 'done'" class="pp-tick"><ion-icon name="checkmark"></ion-icon></span>
                {{ stop.label }}
              </span>
              <!-- Only shown when there's a caption (active nodes). Done/locked
                   have none — a locked node explains itself via a toast on tap. -->
              <span class="pp-panel-detail" *ngIf="stop.detail">
                <ion-icon *ngIf="stop.state === 'active'" name="time-outline"></ion-icon>
                {{ stop.detail }}
              </span>
            </div>
            <span *ngIf="stop.state === 'active'" class="pp-go"><ion-icon name="chevron-forward"></ion-icon></span>
          </div>

          <button type="button" class="pp-node" [disabled]="stop.state === 'locked'"
            [attr.aria-label]="stop.aria" (click)="openStop(block, stop)">
            <ion-icon *ngIf="stop.state !== 'locked'" [name]="stop.node.icon" class="pp-node-icon" aria-hidden="true"></ion-icon>
            <ion-icon *ngIf="stop.state === 'locked'" name="lock-closed" class="pp-node-icon lock" aria-hidden="true"></ion-icon>
          </button>
        </div>
      </div>
    </section>

    <!-- Load more chapters as the user scrolls, instead of building all at once. -->
    <ion-infinite-scroll *ngIf="hasMoreChapters" (ionInfinite)="loadMoreChapters($event)">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>

  <!-- Jump back to the chapter in progress when it's scrolled out of view.
       slot="fixed" pins it to the content viewport so it does NOT scroll. -->
  <button type="button" slot="fixed" class="pp-jump" *ngIf="!isLoading && showJumpFab"
    (pointerdown)="onJumpPointerDown($event)" (pointerup)="onJumpPointerUp($event)" (click)="onJumpClick()"
    [attr.aria-label]="'journeyPlus.goToCurrent' | translate">
    <ion-icon [name]="jumpDirection === 'up' ? 'chevron-up' : 'chevron-down'" aria-hidden="true"></ion-icon>
  </button>
</ion-content>

<!-- The ring, progress and XP trophy moved OUT of the HUD: progress (N/total +
     bar + %) now lives in the header, and XP was removed. The footer keeps just
     the primary action. -->
<ion-footer class="pp-footer ion-no-border" *ngIf="!isLoading && currentChapter">
  <div class="pp-hud">
    <button type="button" class="pp-cta" [disabled]="ctaDisabled" (click)="onCta()">
      <span>{{ ctaLabel }}</span>
      <ion-icon *ngIf="!ctaDisabled" name="chevron-forward" aria-hidden="true"></ion-icon>
    </button>
  </div>
</ion-footer>
