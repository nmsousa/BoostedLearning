<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'words.title' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addWord()" [attr.aria-label]="'mode.addWord' | translate">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
      <!-- Only one menu action (report), so expose it directly as a flag button
           instead of a ⋮ menu. -->
      <ion-button (click)="reportProblem()" [attr.aria-label]="'feedback.report' | translate">
        <ion-icon slot="icon-only" name="flag-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Search + filter + sort live in the HEADER so they stay fixed while the
       word list scrolls beneath them. -->
  <ion-toolbar class="search-toolbar">
    <div class="toolbar-row">
      <ion-searchbar
        class="words-search"
        [value]="search"
        [placeholder]="'words.search' | translate"
        [debounce]="150"
        (ionInput)="onSearch($event)"
        (ionClear)="onSearch($event)">
      </ion-searchbar>

      <!-- Level filter: a labelled button that opens a checkbox popover. The
           label + our own caret are drawn in the button; the ion-select is
           stretched invisibly behind it and owns the tap/interaction. -->
      <div class="filter-ctl" [class.active]="hasLevelFilter">
        <span class="filter-label">{{ levelFilterLabel }}</span>
        <ion-icon name="chevron-down" class="ctl-caret" aria-hidden="true"></ion-icon>
        <ion-select
          class="filter-select"
          [value]="selectedLevels"
          [multiple]="true"
          interface="popover"
          [interfaceOptions]="{ cssClass: 'levels-popover', header: ('words.filterLevels' | translate) }"
          [attr.aria-label]="'words.filterLevels' | translate"
          (ionChange)="onLevelsChange($event)">
          <ion-select-option *ngFor="let lvl of levelOptions" [value]="lvl">
            {{ ('home.level.' + lvl) | translate }}
          </ion-select-option>
        </ion-select>
      </div>

      <!-- Compact sort: swap icon + our own caret; whole control opens popover. -->
      <div class="sort-row">
        <ion-icon name="swap-vertical-outline" class="sort-icon" aria-hidden="true"></ion-icon>
        <ion-icon name="chevron-down" class="ctl-caret" aria-hidden="true"></ion-icon>
        <ion-select
          class="sort-select"
          [value]="sortKey"
          interface="popover"
          [interfaceOptions]="{ cssClass: 'sort-popover', header: ('words.sortBy' | translate) }"
          [attr.aria-label]="'words.sortBy' | translate"
          (ionChange)="onSortChange($event)">
          <ion-select-option *ngFor="let opt of sortOptions" [value]="opt.value">
            {{ opt.labelKey | translate }}
          </ion-select-option>
        </ion-select>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="words-content">
  <!-- Loading skeleton: shown until the first load finishes, so we never flash
       the "no words" message before the data has actually arrived. -->
  <div *ngIf="isLoading" class="word-list skeleton-list">
    <div class="word-row" *ngFor="let _ of skeletonRows">
      <ion-skeleton-text [animated]="true" class="sk-dot"></ion-skeleton-text>
      <div class="word-text">
        <ion-skeleton-text [animated]="true" style="width: 90px;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 60px;"></ion-skeleton-text>
      </div>
      <span class="word-stats">
        <ion-skeleton-text [animated]="true" style="width: 40px;"></ion-skeleton-text>
      </span>
    </div>
  </div>

  <!-- Empty state (no practiced words at all) — only once loading is done. -->
  <div *ngIf="!isLoading && allWords.length === 0" class="empty">
    <ion-icon name="book-outline"></ion-icon>
    <p>{{ 'words.empty' | translate }}</p>
  </div>

  <!-- No search/filter results -->
  <div *ngIf="!isLoading && allWords.length > 0 && words.length === 0" class="empty">
    <ion-icon name="search-outline"></ion-icon>
    <p>{{ 'words.noResults' | translate }}</p>
  </div>

  <!-- Word list. Plain flex rows (NOT ion-item): ion-item's shadow DOM was
       inflating every row to ~144px no matter the custom-property overrides.
       A div row with an explicit height is fully under our control. -->
  <div class="word-list" *ngIf="!isLoading && words.length > 0">
    <!-- A DIV row (not a <button>) so the per-row speaker can be a real nested
         button. The row itself is clickable (opens the priority sheet) with
         keyboard support for a11y. -->
    <div class="word-row" *ngFor="let w of words; trackBy: trackByWord"
      role="button" tabindex="0"
      [class.hidden-word]="w.priority === 'hide'"
      (click)="openPriority(w)" (keydown.enter)="openPriority(w)" (keydown.space)="openPriority(w)">
      <span class="word-dot" [class.learning]="w.level === 'learning'"
        [class.familiar]="w.level === 'familiar'" [class.known]="w.level === 'known'"></span>
      <div class="word-text">
        <span class="word-target">
          {{ w.text }}
          <ion-icon *ngIf="priorityIcon(w)" [name]="priorityIcon(w)" class="priority-flag"
            [class.boost]="w.priority === 'boost'" [class.hide]="w.priority === 'hide'"></ion-icon>
        </span>
        <span class="word-translation">{{ w.translation }}</span>
      </div>
      <!-- Per-word counts and accuracy % are hidden (the dot conveys how well
           the word is known). A tap on the speaker plays the word; a tap
           anywhere else on the row opens the priority sheet. -->
      <button type="button" class="word-audio" (click)="playWord(w, $event)"
        [attr.aria-label]="'mode.playPronunciation' | translate">
        <ion-icon name="volume-high-outline"></ion-icon>
      </button>
      <!-- Slower replay appears once the word has been played twice. -->
      <button type="button" class="word-audio slow" *ngIf="showSlow(w)" (click)="playWord(w, $event, true)"
        [attr.aria-label]="'mode.playSlower' | translate">
        <ion-icon name="hourglass-outline"></ion-icon>
      </button>
    </div>
  </div>
</ion-content>
