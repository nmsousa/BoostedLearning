<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()" [attr.aria-label]="'mode.close' | translate">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      <ng-container *ngIf="levelTitle">{{ levelTitle }}</ng-container>
      <ng-container *ngIf="!levelTitle">{{ 'mode.titleLearn' | translate }}</ng-container>
    </ion-title>
  </ion-toolbar>
  <ion-progress-bar [value]="progress / 100" color="primary"></ion-progress-bar>
</ion-header>

<ion-content [fullscreen]="true" class="learn-content">
  <div *ngIf="isLoading" class="mode-loading"><ion-spinner name="crescent"></ion-spinner></div>

  <div *ngIf="!isLoading && card" class="learn-stage">
    <div class="learn-card">
      <span *ngIf="card.icon" class="learn-icon" aria-hidden="true">{{ card.icon }}</span>

      <div class="learn-word-row">
        <h1 class="learn-fr">{{ card.fr }}</h1>
        <button type="button" class="learn-audio" (click)="playWord()" [attr.aria-label]="'mode.playPronunciation' | translate">
          <ion-icon name="volume-high-outline"></ion-icon>
        </button>
      </div>

      <p class="learn-en">{{ card.en }}</p>

      <!-- Grammar / usage note (Core words). -->
      <div *ngIf="card.note" class="learn-note">
        <ion-icon name="bulb-outline" aria-hidden="true"></ion-icon>
        <span>{{ card.note }}</span>
      </div>
    </div>

    <p class="learn-count">{{ index + 1 }} / {{ cards.length }}</p>
  </div>
</ion-content>

<ion-footer *ngIf="!isLoading && card" class="learn-footer">
  <div class="footer-inner">
    <ion-button fill="clear" color="medium" (click)="prev()" [disabled]="index === 0" class="learn-prev">
      {{ 'common.back' | translate }}
    </ion-button>
    <ion-button expand="block" (click)="next()" class="learn-next">
      {{ (isLast ? 'mode.done' : 'mode.continue') | translate }}
    </ion-button>
  </div>
</ion-footer>
