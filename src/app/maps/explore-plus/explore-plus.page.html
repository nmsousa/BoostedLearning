<ion-header class="ep-header ion-no-border">
  <ion-toolbar>
    <div class="ep-head">
      <button type="button" class="ep-back" (click)="close()" [attr.aria-label]="'journeyPlus.back' | translate">
        <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
      </button>
      <h1 class="ep-title">{{ 'explorePlus.title' | translate }}</h1>
      <span class="ep-head-spacer" aria-hidden="true"></span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ep-content" [scrollY]="true">
  <div *ngIf="isLoading" class="ep-loading"><ion-spinner name="crescent"></ion-spinner></div>

  <div *ngIf="!isLoading" class="ep-body">
    <div *ngIf="adminMode" class="ep-admin-tip">
      <ion-icon name="sparkles-outline" aria-hidden="true"></ion-icon>
      <span>{{ 'tree.adminTip' | translate }}</span>
      <button type="button" class="ep-admin-reset" (click)="resetProgress()"
        [attr.aria-label]="'treePlus.resetProgress' | translate">
        <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
        <span>{{ 'treePlus.resetProgress' | translate }}</span>
      </button>
    </div>

    <p class="ep-tagline">✨ {{ 'explorePlus.tagline' | translate }}</p>

    <div class="ep-block" *ngFor="let block of blocks; trackBy: trackBlock">
      <div class="ep-block-head">{{ 'tree.levelShort' | translate:{ n: block.tier } }}</div>

      <button type="button" class="ep-row" *ngFor="let row of block.rows; trackBy: trackRow"
        [class.core]="row.kind === 'core'"
        [class.locked]="row.locked" [class.done]="row.done"
        [class.pulse]="pulseRowKey === rowKey(row)"
        [attr.data-row-key]="rowKey(row)"
        [style.--hue]="row.hue" [disabled]="row.locked" (click)="toggleRow(row)">
        <span class="ep-emoji" aria-hidden="true">
          <ng-container *ngIf="row.kind === 'core'">📖</ng-container>
          <ng-container *ngIf="row.kind !== 'core'">{{ row.emoji }}</ng-container>
        </span>
        <span class="ep-main">
          <span class="ep-name-row">
            <span class="ep-name">{{ row.title }}</span>
            <ion-icon *ngIf="row.done" name="checkmark-circle" class="ep-badge done" aria-hidden="true"></ion-icon>
            <ion-icon *ngIf="row.locked" name="lock-closed" class="ep-badge lock" aria-hidden="true"></ion-icon>
          </span>
          <span class="ep-progress" *ngIf="!row.locked">
            <span class="ep-progress-track"><span class="ep-progress-fill" [style.width.%]="row.percent"></span></span>
            <span class="ep-progress-pct">{{ row.percent }}%</span>
          </span>
        </span>
        <ion-icon *ngIf="!row.locked" class="ep-caret" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>
    </div>
  </div>
</ion-content>
