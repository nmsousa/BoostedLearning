<ion-header class="tp-header ion-no-border">
  <ion-toolbar>
    <div class="tp-head">
      <button type="button" class="tp-back" (click)="close()" [attr.aria-label]="'journeyPlus.back' | translate">
        <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
      </button>
      <h1 class="tp-title">{{ 'treePlus.title' | translate }}</h1>
      <button type="button" class="tp-lang" id="tp-lang-trigger" [attr.aria-label]="'journeyPlus.changeLanguage' | translate">
        <span class="tp-flag"><img [src]="currentLanguage.flagUrl" alt="" /></span>
        <ion-icon name="chevron-down" class="tp-lang-caret" aria-hidden="true"></ion-icon>
      </button>
      <ion-popover trigger="tp-lang-trigger" [dismissOnSelect]="true" side="bottom" alignment="end">
        <ng-template>
          <ion-list class="lang-list">
            <ion-item *ngFor="let lang of availableLanguages" button detail="false" lines="none"
              [class.active]="lang.code === learningLanguage" (click)="selectLanguage(lang.code)">
              <img class="flag" slot="start" [src]="lang.flagUrl" [alt]="lang.name" />
              <ion-label>{{ lang.name }}</ion-label>
              <ion-icon *ngIf="lang.code === learningLanguage" name="checkmark" slot="end" color="primary"></ion-icon>
            </ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="tp-content" [scrollY]="true">
  <div *ngIf="isLoading || switchingLanguage" class="tp-loading"><ion-spinner name="crescent"></ion-spinner></div>

  <div *ngIf="!isLoading && !switchingLanguage" class="tp-body">
    <div *ngIf="adminMode" class="tp-admin-tip">
      <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
      <span>{{ 'tree.adminTip' | translate }}</span>
      <button type="button" class="tp-admin-reset" (click)="resetProgress()"
        [attr.aria-label]="'treePlus.resetProgress' | translate">
        <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
        <span>{{ 'treePlus.resetProgress' | translate }}</span>
      </button>
    </div>

    <!-- The level is said ONCE, here (not on the Core card and every topic). -->
    <div class="tp-tagline-row">
      <p class="tp-tagline">✨ {{ 'treePlus.tagline' | translate }}</p>
      <span class="tp-level-pill">{{ 'tree.levelShort' | translate:{ n: currentTier(core) } }}</span>
    </div>

    <!-- Hero: Core Vocabulary. Tap → its level page. -->
    <button type="button" class="tp-core" [class.done]="isFullyComplete(core)"
      [class.current]="isNext(core)" [class.finished]="isTierDone(core)" (click)="toggleNode(core)"
      [attr.aria-label]="core.title + ', ' + nodeStatus(core) + ', ' + percentOf(core) + '%'">
      <span class="tp-core-icon" aria-hidden="true">
        <ion-icon name="book"></ion-icon>
        <!-- Check once this level is complete (the bar reads 100%). -->
        <ion-icon *ngIf="isTierDone(core)" class="tp-core-badge" name="checkmark-circle"></ion-icon>
      </span>
      <span class="tp-core-text">
        <span class="tp-core-title">{{ core.title }}</span>
        <span class="tp-core-sub">{{ 'treePlus.foundation' | translate }}</span>
        <span class="tp-core-progress">
          <span class="tp-progress-track"><span class="tp-progress-fill" [style.width.%]="percentOf(core)"></span></span>
          <span class="tp-progress-pct">{{ percentOf(core) }}%</span>
        </span>
      </span>
      <ion-icon class="tp-core-caret" name="chevron-forward" aria-hidden="true"></ion-icon>
    </button>

    <div class="tp-choose">
      <ion-icon name="arrow-down" aria-hidden="true"></ion-icon>
      <span>{{ 'treePlus.chooseTopic' | translate }}</span>
    </div>

    <!-- Theme grid (two columns). -->
    <div class="tp-grid">
      <ng-container *ngFor="let row of themeRows; trackBy: trackRow">
        <button type="button" class="tp-topic" *ngFor="let node of row; trackBy: trackNode"
          [ngClass]="'state-' + node.state"
          [class.current]="isNext(node)" [class.finished]="isTierDone(node)"
          [attr.data-topic-id]="node.id"
          [style.--hue]="node.hue" (click)="toggleNode(node)"
          [attr.aria-label]="node.title + ', ' + nodeStatus(node) + ', ' + percentOf(node) + '%'">
          <!-- Icon on top; status badge overlaid on its corner (check = this
               level is complete, lock = not open yet). -->
          <span class="tp-topic-emoji" aria-hidden="true">
            {{ node.emoji }}
            <ion-icon *ngIf="isTierDone(node)" class="tp-topic-badge done" name="checkmark-circle" aria-hidden="true"></ion-icon>
            <ion-icon *ngIf="node.state === 'locked'" class="tp-topic-badge lock" name="lock-closed" aria-hidden="true"></ion-icon>
          </span>
          <span class="tp-topic-name">{{ node.title }}</span>
          <span class="tp-topic-status" *ngIf="topicStatus(node) as status">{{ status }}</span>
          <!-- Progress bar for every unlocked node (locked show an empty track). -->
          <span class="tp-progress">
            <span class="tp-progress-track"><span class="tp-progress-fill" [style.width.%]="percentOf(node)"></span></span>
            <span class="tp-progress-pct">{{ percentOf(node) }}%</span>
          </span>
        </button>
      </ng-container>
    </div>

  </div>
</ion-content>

<!-- Pinned Continue (like Explore+): plays the next activity of the next node,
     whether that's the Core or a topic. Hidden when nothing is left to do. -->
<ion-footer *ngIf="!isLoading && !switchingLanguage && nextTargetId" class="tp-footer">
  <div class="tp-footer-inner">
    <ion-button expand="block" class="tp-cta" (click)="continueNext()">
      {{ 'journeyPlus.continue' | translate }}
      <ion-icon name="chevron-forward" slot="end" aria-hidden="true"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
