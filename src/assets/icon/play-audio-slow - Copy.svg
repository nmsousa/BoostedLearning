
<svg xmlns="http://www.w3.org/2000/svg"
     width="128"
     height="128"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-label="Snail with animated sound waves">

  <!-- Snail -->
  <g transform="translate(0.3 3.4) scale(0.68)"
     stroke-width="2.0">

    <circle cx="9.5" cy="12.5" r="6.5"/>

    <path d="M12 12.5c0-1.45-1.1-2.6-2.5-2.6S7 11.05 7 12.5s1.1 2.6 2.5 2.6 2.5-1.15 2.5-2.6"/>

    <path d="M3 18.5h12.2c3.2 0 5.8-2.6 5.8-5.8V9"/>

    <path d="M18.8 8.7 18 5.8M21.4 8.4 22.2 5.5"/>

    <circle cx="18" cy="5.5" r=".7"
            fill="currentColor" stroke="none"/>
    <circle cx="22.3" cy="5.2" r=".7"
            fill="currentColor" stroke="none"/>
  </g>

  <!-- Largest wave -->
  <g class="sound-wave wave-outer">
    <path d="M20.3 6.3
             C22.9 9 22.9 15 20.3 17.7"/>
  </g>

  <!-- Middle wave -->
  <g class="sound-wave wave-middle">
    <path d="M18.7 8.3
             C20.4 10 20.4 14 18.7 15.7"/>
  </g>

  <!-- Smallest wave -->
  <g class="sound-wave wave-inner">
    <path d="M17.3 10
             C18.1 11 18.1 13 17.3 14"/>
  </g>

  <style>
    .sound-wave {
      opacity: 0;
      stroke-width: 1.0;
      transform-box: view-box;
      transform-origin: 17.2px 12px;
      animation: wave-appear 650ms
                 cubic-bezier(0.22, 0.61, 0.36, 1)
                 forwards;
    }

    .wave-outer {
      animation-delay: 0ms;
    }

    .wave-middle {
      animation-delay: 250ms;
    }

    .wave-inner {
      animation-delay: 500ms;
    }

    @keyframes wave-appear {
      0% {
        opacity: 0;
        transform: scale(0.05);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sound-wave {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

</svg>
