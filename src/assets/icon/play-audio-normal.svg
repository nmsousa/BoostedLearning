
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="128"
     height="128"
     fill="currentColor"
     aria-label="Speaker with animated sound waves">

  <!-- Original speaker body -->
  <path d="M232 416a23.88 23.88 0 0 1-14.2-4.68 8 8 0 0 1-.66-.51L125.76 336H56a24 24 0 0 1-24-24V200a24 24 0 0 1 24-24h69.75l91.37-74.81a8 8 0 0 1 .66-.51A24 24 0 0 1 256 120v272a24 24 0 0 1-24 24"/>

  <!-- Wave 1: smallest -->
  <path class="sound-wave wave-1"
        d="M320 336a16 16 0 0 1-14.29-23.19c9.49-18.87 14.3-38 14.3-56.81 0-19.38-4.66-37.94-14.25-56.73a16 16 0 0 1 28.5-14.54C346.19 208.12 352 231.44 352 256c0 23.86-6 47.81-17.7 71.19A16 16 0 0 1 320 336"/>

  <!-- Wave 2: middle -->
  <path class="sound-wave wave-2"
        d="M368 384a16 16 0 0 1-13.86-24C373.05 327.09 384 299.51 384 256c0-44.17-10.93-71.56-29.82-103.94a16 16 0 0 1 27.64-16.12C402.92 172.11 416 204.81 416 256c0 50.43-13.06 83.29-34.13 120a16 16 0 0 1-13.87 8"/>

  <!-- Wave 3: outermost -->
  <path class="sound-wave wave-3"
        d="M416 432a16 16 0 0 1-13.39-24.74C429.85 365.47 448 323.76 448 256c0-66.5-18.18-108.62-45.49-151.39a16 16 0 1 1 27-17.22C459.81 134.89 480 181.74 480 256c0 64.75-14.66 113.63-50.6 168.74A16 16 0 0 1 416 432"/>

  <style>
    .sound-wave {
      opacity: 0;
      transform-box: view-box;
      transform-origin: 304px 256px;
      animation: wave-expand 650ms
                 cubic-bezier(0.22, 0.61, 0.36, 1)
                 both;
    }

    /* 1st: Outermost wave */
    .wave-3 {
      animation-delay: 0ms;
    }

    /* 2nd: Middle wave */
    .wave-2 {
      animation-delay: 220ms;
    }

    /* 3rd: Innermost wave */
    .wave-1 {
      animation-delay: 440ms;
    }

    @keyframes wave-expand {
      0% {
        opacity: 0;
        transform: scale(0.04);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sound-wave {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

</svg>
